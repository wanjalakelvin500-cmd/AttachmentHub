
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | KaziLink KE</title>
    <link rel="stylesheet" href="reset.css">
</head>
<body>

<div class="container">

    <a href="index.html" class="brand">
        <span class="brand-icon">K</span>
        KaziLink <span>KE</span>
    </a>

    <div class="reset-card">

        <div class="lock-icon">🔐</div>

        <div class="heading">
            <span class="eyebrow">ACCOUNT RECOVERY</span>
            <h1>Reset Your Password</h1>
            <p>
                Forgot your password? Enter your registered email
                address and we'll guide you through recovery.
            </p>
        </div>

        <!-- STEP 1: REQUEST RESET -->
        <form id="requestForm">

            <div class="field">
                <label for="email">Registered Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required>
            </div>

            <button type="submit" class="submit-btn">
                Send Reset Link →
            </button>

            <p id="requestMessage" class="message" aria-live="polite"></p>
        </form>

        <!-- STEP 2: ENTER NEW PASSWORD -->
        <form id="newPasswordForm" hidden>

            <div class="field">
                <label for="newPassword">New Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="newPassword"
                        minlength="8"
                        placeholder="Enter new password"
                        required>
                    <button type="button" class="toggle"
                            data-target="newPassword">Show</button>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="8"
                        placeholder="Confirm new password"
                        required>
                    <button type="button" class="toggle"
                            data-target="confirmPassword">Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Update Password →
            </button>

            <p id="updateMessage" class="message" aria-live="polite"></p>
        </form>

        <div class="divider"></div>

        <div class="bottom-links">
            <a href="login.html">← Back to Login</a>
            <a href="index.html">Home</a>
        </div>

    </div>

    <p class="footer-text">
        © 2026 KaziLink KE. All rights reserved.
    </p>

</div>

<script src="reset.js"></script>
</body>
</html>
