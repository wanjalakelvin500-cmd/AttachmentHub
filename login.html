
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | KaziLink KE</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container login-container">
    <a href="index.html" class="brand">
        <span class="brand-icon">K</span>
        KaziLink <span>KE</span>
    </a>

    <div class="auth-card login-card">
        <div class="heading">
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Student Login</h1>
            <p>Sign in to continue your career journey.</p>
        </div>

        <form id="loginForm">
            <div class="field">
                <label for="loginEmail">Email address</label>
                <input type="email" id="loginEmail" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <div class="password-box">
                    <input type="password" id="loginPassword" name="password"
                           placeholder="Enter your password" required>
                    <button type="button" class="toggle-password"
                            data-target="loginPassword">Show</button>
                </div>
            </div>

            <div class="login-options">
                <label><input type="checkbox" id="remember"> Remember me</label>
                <a href="reset.html">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Login to Account →</button>
            <p id="loginMessage" class="message" aria-live="polite"></p>
        </form>

        <div class="auth-bottom">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>
    </div>

    <p class="back-home"><a href="index.html">← Back to homepage</a></p>
</div>

<script src="auth.js"></script>
</body>
</html>
