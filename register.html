
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    <a href="index.html" class="brand">
        <span class="brand-icon">Hub</span>
        KaziLink <span>Hub</span>
    </a>

    <div class="auth-card">
        <div class="heading">
            <span class="eyebrow">JOIN KAZILINK Hub</span>
            <h1>Create Student Account</h1>
            <p>Register to discover jobs, internships and industrial attachments.</p>
        </div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="field full">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" name="full_name"
                           placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="student@example.com" required>
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="+254 7XX XXX XXX"
                           pattern="(\+254|0)[17][0-9]{8}" required>
                </div>

                <div class="field full">
                    <label for="institution">College / University</label>
                    <input type="text" id="institution" name="institution"
                           placeholder="Enter your institution" required>
                </div>

                <div class="field">
                    <label for="course">Course of study</label>
                    <input type="text" id="course" name="course"
                           placeholder="e.g. Diploma in ICT" required>
                </div>

                <div class="field">
                    <label for="year">Year of study</label>
                    <select id="year" name="year_of_study" required>
                        <option value="">Select year</option>
                        <option value="Year 1">Year 1</option>
                        <option value="Year 2">Year 2</option>
                        <option value="Year 3">Year 3</option>
                        <option value="Year 4">Year 4</option>
                        <option value="Year 5">Year 5</option>
                        <option value="Graduate">Graduate</option>
                    </select>
                </div>

                <div class="field">
                    <label for="county">County</label>
                    <select id="county" name="county" required>
                        <option value="">Select county</option>
                        <option>Kakamega</option>
                          <option>Masaai</option>
                          <option>Busia</option>
                          <option>Nandi</option>
                          <option>Kisii</option>
                        <option>Nairobi</option>
                        <option>Kisumu</option>
                        <option>Nakuru</option>
                        <option>Siaya</option>
                        <option>Bungoma</option>
                        <option>Uasin Gishu</option>
                        <option>Mombasa</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" name="password"
                               placeholder="Minimum 8 characters" minlength="8" required>
                        <button type="button" class="toggle-password"
                                data-target="password">Show</button>
                    </div>
                </div>

                <div class="field full">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-box">
                        <input type="password" id="confirmPassword"
                               placeholder="Enter password again" required>
                        <button type="button" class="toggle-password"
                                data-target="confirmPassword">Show</button>
                    </div>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" id="agree" required>
                <span>I agree to the KaziLink KE terms and privacy policy.</span>
            </label>

            <button type="submit" class="submit-btn">Create Student Account →</button>
            <p id="registerMessage" class="message" aria-live="polite"></p>
        </form>

        <div class="auth-bottom">
            Already have an account?
            <a href="login.html">Login here</a>
        </div>
    </div>

    <p class="back-home"><a href="index.html">← Back to homepage</a></p>
</div>

<script src="auth.js"></script>
</body>
</html>
